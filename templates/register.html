{% extends "layout.html" %}

{% block title %}
Register - Service Hunting Tool
{% endblock %}

{% block content %}
<div class="container register-container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card register-card">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0"><i class="fas fa-user-plus me-2"></i>Register</h2>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    </div>
                    {% endif %}
                    <form action="/register" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label"><i class="fas fa-user me-2"></i>Name</label>
                            <input id="name" class="form-control" name="name" placeholder="Enter your name" type="text" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label"><i class="fas fa-envelope me-2"></i>Email</label>
                            <input id="email" class="form-control" name="email" placeholder="Enter your email" type="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="cellNo" class="form-label"><i class="fas fa-mobile-alt me-2"></i>Cell No</label>
                            <input id="cellNo" class="form-control" name="cellNo" placeholder="Enter your cell number" type="tel" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                            <input id="password" class="form-control" name="password" placeholder="Create a password" type="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-user-plus me-2"></i>Sign Up
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
